name: Java checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: javac --release 17 -d build src/*.java test/*.java
      - run: java -cp build OrderTimeline
      - run: java -cp build TimelineFixtures
      - run: java -cp build IngestionFixtures
      - run: java -cp build FailureScenarios
